<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rill vs Streamdown</title>
<link rel="stylesheet" href="dist/katex/katex.min.css">
<style>
  :root { --bg:#fbfbfa; --fg:#1d1d1f; --muted:#6e6e73; --line:#e3e3e0; --panel:#fff; --ok:#1a7f37; --bad:#c62828; --accent:#3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151516; --fg:#ececec; --muted:#9a9aa0; --line:#2c2c2e; --panel:#1d1d1f; --ok:#4ac26b; --bad:#ff6b6b; --accent:#8ea2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0 8px 0 0; }
  select, button { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .badge { padding:3px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.ok { color:var(--ok); border:1px solid var(--ok); } .badge.bad { color:var(--bad); border:1px solid var(--bad); }
  .stats { margin-left:auto; display:flex; gap:16px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .stats b { color:var(--fg); }
  main { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1px; background:var(--line); height:calc(100vh - 57px); }
  section { background:var(--bg); overflow:auto; min-width:0; }
  section h2 { position:sticky; top:0; margin:0; padding:8px 16px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:var(--bg); border-bottom:1px solid var(--line); }
  textarea { width:100%; height:calc(100% - 35px); border:0; padding:12px 16px; font:13px/1.5 ui-monospace, Menlo, monospace; background:var(--panel); color:var(--fg); resize:none; outline:none; }
  .render { padding:4px 16px 24px; }
  .render pre { background:var(--panel); border:1px solid var(--line); padding:10px; border-radius:6px; overflow:auto; }
  .render code { font:12.5px ui-monospace, Menlo, monospace; }
  .render table { border-collapse:collapse; } .render td, .render th { border:1px solid var(--line); padding:4px 8px; }
  .render blockquote { margin:0; padding-left:12px; border-left:3px solid var(--line); color:var(--muted); }
  .diff { padding:8px 16px; color:var(--bad); font:12px ui-monospace, Menlo, monospace; white-space:pre-wrap; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } textarea { height:40vh; } }
</style>
</head>
<body>
<header>
  <h1>rill vs Streamdown</h1>
  <select id="example"></select>
  <button id="stream" class="primary">Replay as a stream</button>
  <span id="badge" class="badge"></span>
  <div class="stats">
    <span>Streamdown (JS) <b id="js">–</b></span>
    <span>rill (WASM) <b id="rs">–</b></span>
    <span>speedup <b id="x">–</b></span>
  </div>
</header>
<main>
  <section><h2>Markdown</h2><textarea id="source" spellcheck="false"></textarea></section>
  <section><h2>Streamdown pipeline · unified + remark + rehype</h2><div id="js-out" class="render"></div></section>
  <section><h2>rill · Rust → WASM · <span id="path"></span></h2><div id="diff" class="diff" hidden></div><div id="rs-out" class="render"></div></section>
</main>
<script type="module" src="dist/main.js"></script>
</body>
</html>
