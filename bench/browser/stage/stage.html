<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rill stage</title>
<link rel="stylesheet" href="stage.css">
<style>
  html, body { margin: 0; height: 100%; background: #0e0f11; color: #e8e8ea; }
  body { display: flex; flex-direction: column; font: 16px/1.6 Inter, -apple-system, system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 26px; padding: 16px 26px 14px; border-bottom: 1px solid #26282e; font-variant-numeric: tabular-nums; }
  #engine { font-weight: 700; font-size: 21px; margin-right: auto; }
  body[data-engine="rill"] #engine { color: #4ade80; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat b { font-size: 24px; font-weight: 700; }
  .stat span { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: #8b8d94; }
  #scroll { flex: 1; overflow: hidden auto; padding: 18px 26px 60px; }
  #composer { padding: 12px 26px 20px; border-top: 1px solid #26282e; }
  #ask { width: 100%; box-sizing: border-box; resize: none; padding: 12px 16px; border-radius: 14px; border: 1px solid #3a3d45; background: #1a1c21; color: #e8e8ea; font: inherit; }
  .question { margin: 26px 0 10px auto; width: fit-content; max-width: 75%; padding: 8px 14px; border-radius: 14px; background: #23262d; }
</style>
</head>
<body>
<header>
  <div id="engine">…</div>
  <div class="stat"><b id="fps">0</b><span>fps</span></div>
  <div class="stat"><b id="worst">0</b><span>ms worst frame</span></div>
  <div class="stat"><b id="elapsed">0.0</b><span>seconds</span></div>
</header>
<div id="scroll"><div id="answer"></div></div>
<div id="composer" hidden><textarea id="ask" rows="1" placeholder="Ask a follow-up..."></textarea></div>
<script type="module" src="stage.js"></script>
</body>
</html>
