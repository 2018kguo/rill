name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and pack only, no publish)"
        type: boolean
        default: true

permissions:
  contents: read
  # npm trusted publishing: GitHub's OIDC token replaces an NPM_TOKEN secret.
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  WASM_BINDGEN_VERSION: "0.2.129"

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: wasm-bindgen
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm install --no-audit --no-fund
      - name: Build and test
        working-directory: js
        run: |
          npm run build
          npm test
      - name: Pack
        if: inputs.dry_run
        working-directory: js
        run: npm pack --ignore-scripts --dry-run
      - name: Publish @2018kguo/rill
        if: ${{ !inputs.dry_run }}
        working-directory: js
        run: npm publish --ignore-scripts --provenance --access public
