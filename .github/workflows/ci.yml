name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.129"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: wasm-bindgen
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm install --no-audit --no-fund
      # Real-world Markdown at pinned commits (conformance/real.jsonl, not checked in),
      # which remend.mjs, blocks.mjs and ssr.tsx read.
      - run: node conformance/real.mjs
      - run: cargo test --workspace
      - name: Conformance against Streamdown's JavaScript pipeline
        run: |
          cargo build --release --example stdio
          # Streamdown's `plugins` configurations: none, plugins.math, plugins.cjk, both.
          for config in default math cjk math+cjk; do
            node conformance/diff.mjs --config "$config"
            # Footnotes cited from inside other footnotes, every order up to five pieces.
            node conformance/diff.mjs --config "$config" --pieces '["[^a]","[^b]","[^c]","\n\n[^a]: ","\n\n[^b]: ","\n\n[^c]: ","x"]' --length 5
            # Line endings after a failed code run, inside containers: only plain text holds one.
            node conformance/diff.mjs --config "$config" --pieces '["1. ","> ","[`a`][r]","![`a`](y)","<a b=\"`\">","<http://a`b>","www.a.com/`x","`","x\n   ","\n> x\n> ","[x](y)","\n\n[r]: /u"]' --length 4
            # Backslash escapes beside autolinks: an autolink is claimed before any literal in it.
            node conformance/diff.mjs --config "$config" --pieces '["<","http://a","\\\\_",">","www.b.c","a@b.co","x"]' --length 5
            # Labels across lines in containers, and footnote labels with whitespace.
            node conformance/diff.mjs --config "$config" --pieces '["1. ","> ","[a\n","   ","b]: m","b]","[x]","[^","\n\n[a b]: /u"," "]' --length 4
            # Raw HTML rill renders without parse5: <br>, paired phrasing and formatting tags, comments.
            node conformance/diff.mjs --config "$config" --pieces '["<br>","<BR />","<sup>","</sup>","<b>","</b>","*","a","\n"]' --length 5
            node conformance/diff.mjs --config "$config" --pieces '["| a |\n|-|\n| ","<br>","<kbd>","</kbd>","<!-- c -->","x","|","\n"]' --length 5
          done
          # Wrapper tags sanitize removes (custom elements, listing), closed and left open,
          # in flow and inline, with what they wrap.
          node conformance/diff.mjs --pieces '["<Listing n=\"1\">","</Listing>","<foo>","</foo>","<listing>","</listing>","```\nc\n```","\n\n","\n","> ","- ","x","<b>","</b>","<!-- c -->"]' --length 4
          node conformance/diff.mjs --pieces '["<a-b>","</a-b>","<x-y z=\"1\">","</X-Y>","**","`c`","[a](b)","| a |\n|-|\n| ","x","\n"]' --length 4
          # Streamdown 2.7.1's sanitize schema: tel: and streamdown: (remend's sentinels) URLs.
          node conformance/diff.mjs --pieces '["[a](","![i](","<a href=\"","\">x</a>","tel:+1","streamdown:incomplete-link","Tel:1","javascript:x",")","/p#"]' --length 4
          # remarkCodeMeta: the fence's meta string as `metastring` on <code>.
          node conformance/diff.mjs --pieces '["```","~~~","js"," ","title=\"a\"","{1}","\n","x","\n```"]' --length 5
          node conformance/diff.mjs --config math --pieces '["```","$$","math"," ","m=1","\n","x","\n```","\n$$"]' --length 5
          # No clobber prefix: footnote ids and raw id/name attributes are not prefixed again.
          node conformance/diff.mjs --pieces '["[^a]","\n\n[^a]: n","<a id=\"x\">","<a name=\"y\">","</a>","<h2 id=\"z\">","[^b]"," "]' --length 4
          # GFM's email literal comes before attention, so it may start at `_`.
          node conformance/diff.mjs --pieces '["_","__","a@b.co","x","\\\\"," ","*","["]' --length 5
          # Flanking: micromark's by default (UTF-16 units), remark-cjk-friendly's with plugins.cjk.
          for config in default cjk; do
            node conformance/diff.mjs --config "$config" --pieces '["**","*","_","~~","中","」","「","a",".","。"," "]' --length 5
            node conformance/diff.mjs --config "$config" --pieces '["*","_","~","\uFE0E","\uFE01","“","中","😀","a"," "]' --length 5
          done
          # Streamdown 1.x's default plugins (legacy CJK flanking, default sanitize schema).
          node conformance/diff.mjs --config classic
          node conformance/diff.mjs --config classic --pieces '["**","*","_","~~","中","」","「","a",".","。"," "]' --length 5
          node conformance/diff.mjs --config classic --pieces '["_","__","a@b.co","x","*","[t](tel:+1)","<a id=\"x\">","</a>","[^a]","\n\n[^a]: n"]' --length 4
          # Indented code on micromark's lazy line: after a container that did not continue.
          node conformance/diff.mjs --pieces '["> ","- ","1. ",">\n","    a\n","a\n","\n","```\n"]' --length 5
          # @streamdown/cjk: autolink literals end at CJK punctuation; the rest is relinked.
          node conformance/diff.mjs --config cjk --pieces '["https://x.com/a","www.y.org","a@b.co","。","，","（","）","中","<",">","](https://x.com/b。c)"," "]' --length 4
      - name: remend (Streamdown's streaming repair) against the package
        run: |
          sh scripts/build-wasm.sh
          sh examples/custom-build/build.sh
          node conformance/remend.mjs --fuzz 100000
      - name: JavaScript package
        working-directory: js
        run: |
          npm run build
          npm test
      - name: The drop-in <Streamdown> against Streamdown 2.7.1 (DOM, SSR)
        run: |
          npx playwright install --with-deps chromium
          for config in default code math cjk all; do
            node conformance/dom/dom-diff.mjs --build --config "$config"
          done
          for variant in prefix controls nosafety nolines components rtl static caret block labels icons; do
            node conformance/dom/dom-diff.mjs --config code --variant "$variant"
          done
          node conformance/dom/dom-diff.mjs --config code --stream every=60,short=1
          # A custom build (examples/custom-build) against Streamdown with its JavaScript plugins.
          for variant in engine engine-static; do
            node conformance/dom/dom-diff.mjs --config code --variant "$variant"
          done
          node conformance/dom/dom-diff.mjs --config code --variant engine --stream every=60,short=1
          bun conformance/dom/ssr.tsx --config default
          bun conformance/dom/ssr.tsx --config code
          node conformance/dom/interactions.mjs --candidate self
          node conformance/dom/interactions.mjs
          node conformance/dom/interactions.mjs --static
          bun conformance/dom/ssr.tsx --config code --variant static
          bun conformance/dom/ssr.tsx --config code --variant engine
          node conformance/blocks.mjs --fuzz 3000
