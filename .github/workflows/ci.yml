name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.129"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: wasm-bindgen
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm install --no-audit --no-fund
      - run: cargo test --workspace
      - name: Conformance against Streamdown's JavaScript pipeline
        run: |
          cargo build --release --example stdio
          node conformance/diff.mjs
          # Footnotes cited from inside other footnotes, every order up to five pieces.
          node conformance/diff.mjs --pieces '["[^a]","[^b]","[^c]","\n\n[^a]: ","\n\n[^b]: ","\n\n[^c]: ","x"]' --length 5
          # Line endings after a failed code run, inside containers: only plain text holds one.
          node conformance/diff.mjs --pieces '["1. ","> ","[`a`][r]","![`a`](y)","<a b=\"`\">","<http://a`b>","www.a.com/`x","`","x\n   ","\n> x\n> ","[x](y)","\n\n[r]: /u"]' --length 4
          # Backslash escapes beside autolinks: an autolink is claimed before any literal in it.
          node conformance/diff.mjs --pieces '["<","http://a","\\\\_",">","www.b.c","a@b.co","x"]' --length 5
          # Labels across lines in containers, and footnote labels with whitespace.
          node conformance/diff.mjs --pieces '["1. ","> ","[a\n","   ","b]: m","b]","[x]","[^","\n\n[a b]: /u"," "]' --length 4
      - name: JavaScript package
        working-directory: js
        run: |
          npm run build
          npm test
