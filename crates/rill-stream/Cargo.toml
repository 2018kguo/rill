[package]
name = "rill-stream"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Streamdown's DOM as HTML in one pass, for streaming Markdown"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rill-unicode = { path = "../rill-unicode" }
memchr = { version = "2.8", default-features = false }
rill-remend = { path = "../rill-remend" }
rill-cmark = { path = "../rill-cmark" }
rill-url = { path = "../rill-url" }
wasm-bindgen = { version = "=0.2.129", optional = true }

[features]
wasm = ["dep:wasm-bindgen", "rill-url/wasm"]
# The UTF-8 and HTML entry points, for probes and the Node tests.
probe = []

[dev-dependencies]
rill = { path = "../rill" }
serde_json = "1"
