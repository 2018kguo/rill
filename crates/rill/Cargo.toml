[package]
name = "rill"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Streamdown's Markdown pipeline (remark + rehype) in Rust, node-for-node identical."
repository = "https://github.com/2018kguo/rill"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rill-cmark = { path = "../rill-cmark" }
memchr = "2.8"
url = "2.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
