[package]
name = "rill"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Streamdown's Markdown pipeline (remark + rehype) in Rust, node-for-node identical."
repository = "https://github.com/2018kguo/rill"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rill-cmark = { path = "../rill-cmark" }
memchr = "2.8"

wasm-bindgen = { version = "=0.2.129", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
url = "2.5"

[features]
# `rill::wasm`: the opcode boundary the JavaScript package reads, for builds with their
# own plugins.
wasm = ["dep:wasm-bindgen"]
# The stock export (`renderHast`) the prebuilt package ships.
wasm-exports = ["wasm"]
